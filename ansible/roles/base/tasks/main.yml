---
- name: Mettre a jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - vim
      - qemu-guest-agent
    state: present

- name: Activer et demarrer QEMU Guest Agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
